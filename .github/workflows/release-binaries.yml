name: Portable binaries

on:
  # Validate that downloadable binaries can be produced for every commit on
  # the main development branches. Version tags additionally publish a release.
  push:
    branches: [ "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86-64 (Ubuntu 20.04 baseline)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            libblosc-dev \
            libboost-filesystem-dev \
            libboost-iostreams-dev \
            libboost-regex-dev \
            libbz2-dev \
            libcppunit-dev \
            libeigen3-dev \
            liblzma-dev \
            liblz4-dev \
            libsnappy-dev \
            libtclap-dev \
            libzstd-dev \
            pkg-config \
            tar \
            zlib1g-dev

      - uses: actions/checkout@v5

      # Ubuntu 20.04's static liblzma omits the multithreaded encoder symbols
      # required by Boost.Iostreams. Build a pinned, complete static archive.
      - name: Build static XZ dependency
        run: |
          curl --fail --location --retry 3 \
            --output xz-5.8.3.tar.gz \
            https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.gz
          echo "3d3a1b973af218114f4f889bbaa2f4c037deaae0c8e815eec381c3d546b974a0  xz-5.8.3.tar.gz" \
            | sha256sum --check
          tar -xzf xz-5.8.3.tar.gz
          cd xz-5.8.3
          ./configure \
            --prefix=/opt/xz-static \
            --disable-shared \
            --enable-static \
            --disable-doc
          make -j"$(nproc)"
          make install

      - name: Configure portable static build
        run: |
          cmake -S src -B build-portable \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORTABLE_BUILD=ON \
            -DSTATIC_DEPENDENCIES=ON \
            -DHAS_OPENMP=OFF \
            -DBoost_USE_STATIC_LIBS=ON \
            -DLIBLZMA_LIBRARY=/opt/xz-static/lib/liblzma.a \
            -DLIBLZMA_INCLUDE_DIR=/opt/xz-static/include \
            -DZLIB_LIBRARY=/usr/lib/x86_64-linux-gnu/libz.a \
            -DBZIP2_LIBRARY_RELEASE=/usr/lib/x86_64-linux-gnu/libbz2.a \
            -DZSTD_LIBRARY=/usr/lib/x86_64-linux-gnu/libzstd.a \
            -DBLOSC_LIBRARY=/usr/lib/libblosc.a \
            -DLZ4_LIBRARY=/usr/lib/x86_64-linux-gnu/liblz4.a \
            -DSNAPPY_LIBRARY=/usr/lib/x86_64-linux-gnu/libsnappy.a \
            -DCPPUNIT_LIBRARY=/usr/lib/x86_64-linux-gnu/libcppunit.a \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      # Build only the executable and static-library-based tests. The normal
      # shared library remains covered by build.yml and is not part of this bundle.
      - name: Build executable and tests
        run: |
          cmake --build build-portable --parallel --target \
            den2obj_exec \
            TestIsosurface \
            TestScalarField \
            TestD2OFileFormat \
            TestGenerator

      - name: Run tests
        working-directory: build-portable
        run: ctest --output-on-failure

      - name: Verify binary is static
        run: |
          file build-portable/den2obj
          if readelf -d build-portable/den2obj 2>/dev/null | grep -q NEEDED; then
            echo "The Linux executable still has dynamic library dependencies."
            readelf -d build-portable/den2obj
            exit 1
          fi
          build-portable/den2obj --version

      - name: Package Linux binary
        run: |
          mkdir -p package/den2obj-linux-x86_64
          cp build-portable/den2obj package/den2obj-linux-x86_64/
          cp LICENSE README.md package/den2obj-linux-x86_64/
          tar -C package -czf den2obj-linux-x86_64.tar.gz den2obj-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: den2obj-linux-x86_64
          path: den2obj-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86-64 (MSYS2 MinGW-w64)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            curl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-snappy

      # TCLAP is header-only and is not packaged in the MSYS2 MinGW repository.
      - name: Fetch pinned TCLAP headers
        shell: msys2 {0}
        run: |
          curl --fail --location --retry 3 \
            --output tclap-v1.2.5.tar.gz \
            https://github.com/mirror/tclap/archive/58c5c8ef24111072fc21fb723f8ab45d23395809.tar.gz
          echo "8e02340d1ca762f9b7c49c62c8f07a37fc9f9f87d58051987ce7e73a95921871  tclap-v1.2.5.tar.gz" \
            | sha256sum --check
          tar -xzf tclap-v1.2.5.tar.gz

      # C-Blosc embeds a private pthread implementation for generic Windows
      # builds. That collides with MinGW's libwinpthread when everything is
      # linked statically, so build it with the native MinGW pthread API.
      - name: Build MinGW-compatible static Blosc
        shell: msys2 {0}
        run: |
          curl --fail --location --retry 3 \
            --output blosc-1.21.6.tar.gz \
            https://github.com/Blosc/c-blosc/archive/v1.21.6/blosc-1.21.6.tar.gz
          echo "9fcd60301aae28f97f1301b735f966cc19e7c49b6b4321b839b4579a0c156f38  blosc-1.21.6.tar.gz" \
            | sha256sum --check
          tar -xzf blosc-1.21.6.tar.gz
          sed -i \
            '/Include the win32\/pthread.h library/{n;s/#if defined(_WIN32)/#if defined(_WIN32) \&\& !defined(__MINGW32__)/;}' \
            c-blosc-1.21.6/blosc/blosc.c
          grep -A1 'Include the win32/pthread.h library' c-blosc-1.21.6/blosc/blosc.c \
            | grep -qF '#if defined(_WIN32) && !defined(__MINGW32__)'
          cmake -S c-blosc-1.21.6 -B blosc-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PWD/blosc-static" \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_FUZZERS=OFF \
            -DDEACTIVATE_AVX2=ON \
            -DDEACTIVATE_SNAPPY=ON \
            -DPREFER_EXTERNAL_LZ4=ON \
            -DPREFER_EXTERNAL_ZLIB=ON \
            -DPREFER_EXTERNAL_ZSTD=ON
          cmake --build blosc-build --parallel
          cmake --install blosc-build
          if nm --defined-only blosc-static/lib/libblosc.a \
            | grep -Eq ' [Tt] pthread_(create|cond_)'; then
            echo "The patched Blosc archive still embeds pthread functions."
            exit 1
          fi

      - name: Configure portable static build
        shell: msys2 {0}
        run: |
          cmake -S src -B build-portable -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORTABLE_BUILD=ON \
            -DSTATIC_DEPENDENCIES=ON \
            -DHAS_OPENMP=OFF \
            -DTCLAP_INCLUDE_DIR="$PWD/tclap-58c5c8ef24111072fc21fb723f8ab45d23395809/include" \
            -DBoost_USE_STATIC_LIBS=ON \
            -DLIBLZMA_LIBRARY="$MINGW_PREFIX/lib/liblzma.a" \
            -DZLIB_LIBRARY="$MINGW_PREFIX/lib/libz.a" \
            -DBZIP2_LIBRARY_RELEASE="$MINGW_PREFIX/lib/libbz2.a" \
            -DZSTD_LIBRARY="$MINGW_PREFIX/lib/libzstd.a" \
            -DBLOSC_INCLUDE_DIR="$PWD/blosc-static/include" \
            -DBLOSC_LIBRARY="$PWD/blosc-static/lib/libblosc.a" \
            -DLZ4_LIBRARY="$MINGW_PREFIX/lib/liblz4.a" \
            -DSNAPPY_LIBRARY="$MINGW_PREFIX/lib/libsnappy.a" \
            -DCPPUNIT_LIBRARY="$MINGW_PREFIX/lib/libcppunit.a" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Audit static link plan
        shell: msys2 {0}
        run: |
          if grep -Fq 'libzstd.dll.a' build-portable/build.ninja; then
            echo "Boost.Iostreams still selected the Zstandard DLL import library."
            grep -nF 'libzstd.dll.a' build-portable/build.ninja
            exit 1
          fi

      - name: Build executable and tests
        shell: msys2 {0}
        run: |
          cmake --build build-portable --parallel --target \
            den2obj_exec \
            TestIsosurface \
            TestScalarField \
            TestD2OFileFormat \
            TestGenerator

      - name: Run tests
        shell: msys2 {0}
        working-directory: build-portable
        run: ctest --output-on-failure

      - name: Verify and package Windows binary
        shell: msys2 {0}
        run: |
          dlls="$(objdump -p build-portable/den2obj.exe \
            | sed -n 's/^[[:space:]]*DLL Name: //p')"
          echo "$dlls" | sed 's/^/DLL: /'
          unexpected_dlls="$(echo "$dlls" | grep -Eiv \
            '^(ADVAPI32|bcrypt|COMCTL32|COMDLG32|CRYPT32|GDI32|IMM32|KERNEL32|msvcrt|ntdll|ole32|OLEAUT32|RPCRT4|SHELL32|SHLWAPI|USER32|VERSION|WINMM|WINSPOOL|WS2_32|api-ms-win-[A-Za-z0-9-]+)\.dll$' || true)"
          if [[ -n "$unexpected_dlls" ]]; then
            echo "The Windows executable has unexpected non-system dependencies:"
            echo "$unexpected_dlls"
            exit 1
          fi
          mkdir -p package/den2obj-windows-x86_64
          cp build-portable/den2obj.exe package/den2obj-windows-x86_64/
          cp LICENSE README.md package/den2obj-windows-x86_64/
          pacman -Q > package/den2obj-windows-x86_64/DEPENDENCIES.txt

          # Run the packaged executable without MSYS2's DLL directory on PATH.
          windows_system_path="$(cygpath -u "$WINDIR/System32")"
          PATH="$windows_system_path" \
            package/den2obj-windows-x86_64/den2obj.exe --version

          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path 'package/den2obj-windows-x86_64' -DestinationPath 'den2obj-windows-x86_64.zip'"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: den2obj-windows-x86_64
          path: den2obj-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: brew install cmake tclap cppunit eigen pkgconf

      # Homebrew bottles target the macOS version on which they were built.
      # Compile the libraries embedded in the executable ourselves so every
      # object file uses the advertised macOS 12 deployment target.
      - name: Restore macOS 12 static dependencies
        id: macos-dependencies
        uses: actions/cache@v4
        with:
          path: macos-deps
          key: macos12-static-v1-${{ matrix.arch }}-boost1.90.0-blosc1.21.6-xz5.8.3-zstd1.5.7-lz4-1.10.0-snappy1.2.2

      - name: Build macOS 12 static dependencies
        if: steps.macos-dependencies.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/build-macos-static-dependencies.sh \
            "${{ matrix.arch }}" \
            "$PWD/macos-deps"

      - name: Configure portable static build
        run: |
          cppunit_prefix="$(brew --prefix cppunit)"
          cmake -S src -B build-portable \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$PWD/macos-deps;$cppunit_prefix;$(brew --prefix eigen);$(brew --prefix tclap)" \
            -DPORTABLE_BUILD=ON \
            -DSTATIC_DEPENDENCIES=ON \
            -DHAS_OPENMP=OFF \
            -DBoost_ROOT="$PWD/macos-deps" \
            -DBoost_USE_STATIC_LIBS=ON \
            -DLIBLZMA_LIBRARY="$PWD/macos-deps/lib/liblzma.a" \
            -DLIBLZMA_INCLUDE_DIR="$PWD/macos-deps/include" \
            -DZSTD_LIBRARY="$PWD/macos-deps/lib/libzstd.a" \
            -DBLOSC_INCLUDE_DIR="$PWD/macos-deps/include" \
            -DBLOSC_LIBRARY="$PWD/macos-deps/lib/libblosc.a" \
            -DLZ4_LIBRARY="$PWD/macos-deps/lib/liblz4.a" \
            -DSNAPPY_LIBRARY="$PWD/macos-deps/lib/libsnappy.a" \
            -DCPPUNIT_INCLUDE_DIR="$cppunit_prefix/include" \
            -DCPPUNIT_LIBRARY="$cppunit_prefix/lib/libcppunit.a"

      - name: Build executable and tests
        run: |
          cmake --build build-portable --parallel --target \
            den2obj_exec \
            TestIsosurface \
            TestScalarField \
            TestD2OFileFormat \
            TestGenerator

      - name: Run tests
        working-directory: build-portable
        run: ctest --output-on-failure

      - name: Stage macOS binary
        run: |
          package_dir="package/den2obj-macos-${{ matrix.arch }}"
          mkdir -p "$package_dir"
          cp build-portable/den2obj "$package_dir/"
          cp LICENSE README.md "$package_dir/"

      - name: Audit and sign executable
        run: |
          package_dir="package/den2obj-macos-${{ matrix.arch }}"
          : > macos-dependencies.txt
          : > macos-build-versions.txt
          for binary in "$package_dir/den2obj"; do
            otool -L "$binary" | tee -a macos-dependencies.txt
            vtool -show-build "$binary" | tee -a macos-build-versions.txt

            minos_values="$(vtool -show-build "$binary" \
              | awk '$1 == "minos" { print $2 }')"
            if [[ -z "$minos_values" ]]; then
              echo "Could not determine the minimum macOS version for $binary."
              exit 1
            fi
            while IFS= read -r minos; do
              if ! awk -v actual="$minos" -v maximum="12.0" 'BEGIN {
                split(actual, a, "."); split(maximum, b, ".");
                exit !((a[1] < b[1]) || (a[1] == b[1] && a[2] <= b[2]));
              }'; then
                echo "$binary requires macOS $minos, newer than the 12.0 baseline."
                exit 1
              fi
            done <<< "$minos_values"
          done

          unexpected_dependencies="$(awk '/^[[:space:]]/ { print $1 }' macos-dependencies.txt \
            | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "The macOS executable still has non-system dynamic dependencies:"
            echo "$unexpected_dependencies"
            exit 1
          fi

          codesign --force --sign - "$package_dir/den2obj"
          codesign --verify --strict "$package_dir/den2obj"
          "$package_dir/den2obj" --version
          cp macos-dependencies.txt "$package_dir/DEPENDENCIES.txt"
          cp macos-build-versions.txt "$package_dir/BUILD-VERSIONS.txt"
          cp macos-deps/VERSIONS.txt "$package_dir/STATIC-DEPENDENCIES.txt"

      - name: Package macOS binary
        run: |
          tar -C package -czf "den2obj-macos-${{ matrix.arch }}.tar.gz" \
            "den2obj-macos-${{ matrix.arch }}"

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: den2obj-macos-${{ matrix.arch }}
          path: den2obj-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_tag="${{ github.ref_name }}"
          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version tags must use the form vX.X.X; got: $version_tag"
            exit 1
          fi

          project_version="$(sed -nE \
            's/^project\(den2obj VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
            src/CMakeLists.txt)"
          if [[ -z "$project_version" || "$version_tag" != "v$project_version" ]]; then
            echo "Tag $version_tag does not match project version $project_version."
            exit 1
          fi

          sha256sum release-assets/* > release-assets/SHA256SUMS

          release_title="Patch $version_tag"
          if gh release view "$version_tag" >/dev/null 2>&1; then
            gh release edit "$version_tag" --title "$release_title"
            gh release upload "$version_tag" release-assets/* --clobber
          else
            gh release create "$version_tag" release-assets/* \
              --title "$release_title" \
              --generate-notes \
              --verify-tag
          fi
