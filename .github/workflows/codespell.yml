name: codespell

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          only_warn: 1
          config: .codespellrc
          ignore_words_file: .codespell-ignore

      - name: Write codespell report
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/codespell-venv"
          "$RUNNER_TEMP/codespell-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary :all: \
            --require-hashes \
            --requirement .github/requirements/codespell.txt
          "$RUNNER_TEMP/codespell-venv/bin/codespell" \
            --config .codespellrc > codespell.txt 2>&1 || true
          echo "--- findings: $(wc -l < codespell.txt)"
          cat codespell.txt

      - name: Upload codespell report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codespell-report
          path: codespell.txt
          if-no-files-found: error
          retention-days: 7
